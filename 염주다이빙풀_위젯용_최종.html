<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>염주체육관 다이빙풀 블로그 타이틀</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  @font-face {
    font-family: 'Jalnan';
    src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_four@1.2/JalnanOTF00.woff') format('woff');
    font-weight: normal;
    font-style: normal;
  }
</style>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Jalnan', 'Noto Sans KR', sans-serif;
    background: #0a1628;
  }

  .blog-header {
    position: relative;
    width: 966px;
    height: 600px;
    overflow: hidden;
    margin: 0 auto;
  }

  /* 배경 이미지 */
  .bg-image {
    position: absolute;
    inset: 0;
    background-image: url('https://postfiles.pstatic.net/MjAyNjA1MDJfNzAg/MDAxNzc3Njk3ODg1Mzk2.JQS5eiL6lK2FLbXw-9ImvOiAUBARmA8mAZuYJjzXvaYg.f3DgfXVFL8qUrRr1iPjVKAcNPssvwdb3NlKkSKx2CjMg.PNG/%EA%B3%A0%EB%9E%98%EC%83%81%EC%96%B4.png?type=w966');
    background-size: cover;
    background-position: center 40%;
    transform: scale(1.03);
    animation: slowZoom 20s ease-in-out infinite alternate;
  }

  @keyframes slowZoom {
    0% { transform: scale(1.03); }
    100% { transform: scale(1.08); }
  }

  /* 오버레이 레이어들 */
  .overlay-dark {
    position: absolute;
    inset: 0;
    background: linear-gradient(
      180deg,
      rgba(5, 20, 45, 0.15) 0%,
      rgba(3, 15, 35, 0.05) 30%,
      rgba(3, 15, 35, 0.25) 65%,
      rgba(2, 10, 25, 0.75) 100%
    );
  }

  /* 물결 광선 효과 */
  .caustic-overlay {
    position: absolute;
    inset: 0;
    background:
      radial-gradient(ellipse 60% 30% at 30% 20%, rgba(80,160,220,0.12) 0%, transparent 70%),
      radial-gradient(ellipse 40% 20% at 70% 10%, rgba(100,180,240,0.08) 0%, transparent 60%);
    animation: causticShift 8s ease-in-out infinite alternate;
  }

  @keyframes causticShift {
    0% { opacity: 0.7; }
    100% { opacity: 1; }
  }



  /* 메인 콘텐츠 영역 */
  .content-area {
    position: absolute;
    bottom: 150px;
    left: 0; right: 0;
    text-align: center;
    padding: 0 40px;
  }

  .badge {
    display: inline-block;
    margin-bottom: 18px;
    padding: 4px 16px;
    border: 1.5px solid rgba(0, 220, 255, 0.9);
    border-radius: 20px;
    background: rgba(0,120,200,0.55);
    backdrop-filter: blur(6px);
    font-size: 11px;
    font-weight: 400;
    letter-spacing: 3px;
    color: rgba(200, 245, 255, 1.0);
    text-transform: uppercase;
  }

  .main-title {
    font-family: 'Jalnan', 'Noto Sans KR', sans-serif;
    font-size: 46px;
    font-weight: 700;
    color: #ffffff;
    letter-spacing: -0.5px;
    line-height: 1.2;
    text-shadow: 0 2px 25px rgba(0,80,180,0.7), 0 0 80px rgba(50,180,255,0.5), 0 0 3px rgba(255,255,255,0.3);
    margin-bottom: 10px;
    animation: fadeUp 1.2s ease-out both;
  }

  .sub-title {
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 15px;
    font-weight: 300;
    color: rgba(210, 245, 255, 1.0);
    letter-spacing: 1.5px;
    line-height: 1.8;
    animation: fadeUp 1.2s 0.2s ease-out both;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(16px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* 메뉴 영역 */
  .menu-area {
    position: absolute;
    bottom: 0;
    left: 0; right: 0;
    height: 120px;
    background: rgba(5, 25, 60, 0.88);
    backdrop-filter: blur(14px);
    border-top: 1.5px solid rgba(0, 200, 255, 0.45);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 40px;
  }

  .menu-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 7px;
    text-decoration: none;
    cursor: pointer;
    transition: transform 0.3s ease;
  }

  .menu-item:hover { transform: translateY(-4px); }

  .menu-circle {
    width: 72px;
    height: 72px;
    border-radius: 50%;
    background: linear-gradient(145deg, rgba(10,90,180,0.85), rgba(5,55,130,0.9));
    border: 2px solid rgba(0,210,255,0.7);
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.3s ease;
    box-shadow: 0 4px 20px rgba(0,50,180,0.6), inset 0 1px 0 rgba(150,220,255,0.3), 0 0 10px rgba(0,180,255,0.15);
    position: relative;
    overflow: hidden;
  }

  .menu-circle::before {
    content: '';
    position: absolute;
    top: -50%;
    left: -50%;
    width: 200%;
    height: 200%;
    background: radial-gradient(circle at 40% 40%, rgba(100,180,255,0.15), transparent 60%);
  }

  .menu-item:hover .menu-circle {
    border-color: rgba(0, 240, 255, 1.0);
    box-shadow: 0 8px 28px rgba(0,130,255,0.7), 0 0 30px rgba(0,220,255,0.35);
    background: linear-gradient(145deg, rgba(0,130,220,0.98), rgba(0,80,170,0.98));
  }

  .menu-icon {
    font-size: 30px;
    filter: drop-shadow(0 1px 4px rgba(100,180,255,0.4));
  }

  .menu-label {
    font-family: 'Jalnan', 'Noto Sans KR', sans-serif;
    font-size: 14px;
    font-weight: 400;
    color: rgba(180, 230, 255, 1.0);
    letter-spacing: 0.5px;
    white-space: nowrap;
    transition: color 0.3s ease;
  }

  .menu-item:hover .menu-label {
    color: rgba(255, 255, 255, 1);
  }

  /* 좌측 엠블럼 */
  .emblem {
    position: absolute;
    top: 20px;
    left: 28px;
    display: flex;
    align-items: center;
    gap: 9px;
    opacity: 0.9;
  }

  .emblem-circle {
    width: 52px;
    height: 52px;
    border-radius: 50%;
    border: 1.5px solid rgba(0,220,255,0.75);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    background: rgba(255,255,255,0.92);
    backdrop-filter: blur(4px);
  }

  .emblem-text {
    font-family: 'Jalnan', 'Noto Sans KR', sans-serif;
    font-size: 11px;
    color: rgba(200,240,255,1.0);
    letter-spacing: 0.5px;
    line-height: 1.5;
  }

  /* 파티클 효과 */
  .particles {
    position: absolute;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
  }

  .particle {
    position: absolute;
    width: 2px;
    height: 2px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.95);
    box-shadow: 0 0 6px rgba(0, 220, 255, 1.0), 0 0 12px rgba(100, 200, 255, 0.6);
    animation: bubbleRise linear infinite;
  }

  @keyframes bubbleRise {
    0%   { transform: translateY(0) translateX(0); opacity: 0; }
    10%  { opacity: 1; }
    30%  { transform: translateY(-150px) translateX(-12px); }
    60%  { transform: translateY(-310px) translateX(15px); }
    85%  { opacity: 0.7; }
    100% { transform: translateY(-520px) translateX(-8px); opacity: 0; }
  }
</style>
</head>
